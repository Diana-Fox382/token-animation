<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Как языковая модель пишет текст — Нейродневник лисы</title>
<style>
  :root {
    --bg-main: #090d16;
    --bg-stage: #0d1322;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --fox-accent: #f97316;
    --model-border: #38bdf8;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", Consolas, "Courier New", monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #05070c;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
    color: var(--text-main);
  }

  /* 16:9 Stage Wrapper */
  #stage-wrapper {
    position: relative;
    width: 1280px;
    height: 720px;
    transform-origin: center center;
    background: radial-gradient(circle at 50% 35%, #131c31 0%, #090d16 75%);
    border-radius: 12px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.06);
    overflow: hidden;
    cursor: pointer;
  }

  /* Subtle Infographic Grid */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Main high-DPI Canvas */
  #anim-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    display: block;
    z-index: 1;
  }

  /* Controls Hint Bar (Hidden with H) */
  #controls-bar {
    position: absolute;
    top: 18px;
    left: 22px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 13px;
    color: #cbd5e1;
    backdrop-filter: blur(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 99999;
    pointer-events: auto;
  }

  #controls-bar.hud-hidden {
    display: none !important;
    opacity: 0;
    pointer-events: none;
  }

  .ctrl-btn {
    appearance: none;
    -webkit-appearance: none;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #e2e8f0;
    font-family: var(--font-sans);
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    pointer-events: auto;
    outline: none;
  }

  .ctrl-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.28);
  }

  .ctrl-btn:active,
  .ctrl-btn.flash-active {
    background: rgba(249, 115, 22, 0.28);
    border-color: rgba(249, 115, 22, 0.75);
    transform: scale(0.97);
  }

  /* Tiny restore button when HUD is hidden */
  #hud-restore-btn {
    position: absolute;
    top: 14px;
    left: 16px;
    z-index: 99999;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #f8fafc;
    font-size: 12px;
    line-height: 1;
    padding: 5px 9px;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0.15;
    transition: opacity 0.2s ease, background 0.2s ease;
    display: none;
    pointer-events: auto;
    outline: none;
  }

  #hud-restore-btn.visible {
    display: block;
  }

  #hud-restore-btn:hover {
    opacity: 0.85;
    background: rgba(15, 23, 42, 0.92);
  }

  .key-badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
    flex-shrink: 0;
  }

  .status-dot.paused {
    background: #f59e0b;
    box-shadow: 0 0 8px #f59e0b;
  }

  /* Start Overlay Prompt */
  #start-prompt {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #e2e8f0;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.2px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
    z-index: 10;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }

  #start-prompt.hidden {
    opacity: 0;
    transform: translateX(-50%) translateY(10px);
  }

  /* Channel Watermark */
  #watermark {
    position: absolute;
    bottom: 18px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(248, 250, 252, 0.55);
    letter-spacing: 0.3px;
    z-index: 10;
    pointer-events: none;
  }

  .fox-icon {
    width: 18px;
    height: 18px;
    display: inline-block;
  }
</style>
</head>
<body tabindex="0" style="outline: none;">

<div id="stage-wrapper">
  <div class="bg-grid"></div>
  <canvas id="anim-canvas"></canvas>

  <!-- Toggleable Keyboard & Touch Hint Bar -->
  <div id="controls-bar" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()">
    <button
      id="btn-toggle"
      type="button"
      class="ctrl-btn"
      onpointerdown="event.stopPropagation()"
      onclick="event.stopPropagation(); window.appTogglePlay(this);"
      title="Старт или пауза (Пробел)"
    >
      <span id="play-indicator" class="status-dot paused"></span>
      <span class="key-badge">Пробел</span>
      <span id="toggle-label">Старт / Пауза</span>
    </button>

    <button
      id="btn-restart"
      type="button"
      class="ctrl-btn"
      onpointerdown="event.stopPropagation()"
      onclick="event.stopPropagation(); window.appRestart(this);"
      title="Начать заново с 0-й секунды (R)"
    >
      <span class="key-badge">R</span>
      <span>Сначала</span>
    </button>

    <button
      id="btn-hide"
      type="button"
      class="ctrl-btn"
      onpointerdown="event.stopPropagation()"
      onclick="event.stopPropagation(); window.appToggleHud(this);"
      title="Скрыть или показать подсказку (H)"
    >
      <span class="key-badge">H</span>
      <span>Скрыть подсказку</span>
    </button>
  </div>

  <!-- Subtle corner button to bring HUD back on mobile/mouse when hidden -->
  <button
    id="hud-restore-btn"
    type="button"
    onpointerdown="event.stopPropagation()"
    onclick="event.stopPropagation(); window.appToggleHud(this);"
    title="Показать панель управления (H)"
  >•••</button>

  <!-- Initial Start Banner -->
  <div id="start-prompt">Нажмите Пробел или кликните для старта анимации</div>

  <!-- Channel Signature -->
  <div id="watermark">
    <svg class="fox-icon" viewBox="0 0 24 24" fill="none">
      <path d="M4 3L9.5 8.5L12 7L14.5 8.5L20 3L19 14L12 21L5 14L4 3Z" fill="#f97316" fill-opacity="0.9"/>
      <path d="M12 21L9 15.5L12 17L15 15.5L12 21Z" fill="#fff" fill-opacity="0.85"/>
    </svg>
    <span>Нейродневник лисы</span>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ============================================================================
  // 1. STAGE & CANVAS SETUP (1280x720, HiDPI, Auto-Scale)
  // ============================================================================
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const TIMELINE_END = 38.0;

  const stageWrapper = document.getElementById('stage-wrapper');
  const canvas = document.getElementById('anim-canvas');
  const ctx = canvas.getContext('2d');
  const controlsBar = document.getElementById('controls-bar');
  const startPrompt = document.getElementById('start-prompt');
  const playIndicator = document.getElementById('play-indicator');

  function setupCanvasAndScale() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = STAGE_W * dpr;
    canvas.height = STAGE_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const scaleX = window.innerWidth / STAGE_W;
    const scaleY = window.innerHeight / STAGE_H;
    const scale = Math.min(scaleX, scaleY) * 0.96;
    stageWrapper.style.transform = `scale(${scale})`;
  }

  window.addEventListener('resize', setupCanvasAndScale);
  setupCanvasAndScale();

  // ============================================================================
  // 2. EXACT TOKENIZATION DATA (o200k_base)
  // ============================================================================
  const FULL_USER_TEXT = "Изучай правила как профессионал, чтобы потом разрушить их как";

  const BASE_TOKENS = [
    { text: "Из",          id: "55428",  color: "#38bdf8" },
    { text: "уч",          id: "4497",   color: "#a78bfa" },
    { text: "ай",          id: "2568",   color: "#34d399" },
    { text: " правила",    id: "69862",  color: "#f472b6" },
    { text: " как",        id: "6220",   color: "#f59e0b", isSamePair: true },
    { text: " профессион", id: "52129",  color: "#60a5fa" },
    { text: "ал",          id: "1019",   color: "#a3e635" },
    { text: ",",           id: "11",     color: "#fb7185" },
    { text: " чтобы",      id: "15419",  color: "#2dd4bf" },
    { text: " потом",      id: "50906",  color: "#c084fc" },
    { text: " разруш",     id: "135165", color: "#fb923c" },
    { text: "ить",         id: "3707",   color: "#818cf8" },
    { text: " их",         id: "11229",  color: "#4ade80" },
    { text: " как",        id: "6220",   color: "#f59e0b", isSamePair: true }
  ];

  const MODEL_TOKENS = [
    { text: " худож", id: "122819", color: "#fb923c", isModel: true },
    { text: "ник",    id: "11072",  color: "#38bdf8", isModel: true },
    { text: ".",      id: "13",     color: "#f472b6", isModel: true },
    { text: "EOS",    id: "",       color: "#ef4444", isModel: true, isEOS: true }
  ];

  const ALL_TOKENS = [...BASE_TOKENS, ...MODEL_TOKENS];

  // ============================================================================
  // 3. GENERATION ROUNDS & TIMINGS
  // ============================================================================
  const ROUNDS_DATA = [
    {
      spawnTokenIndex: 0,
      candidates: [
        { label: "« худож»",  pct: 71, winner: true },
        { label: "« мастер»", pct: 9,  winner: false },
        { label: "« твор»",   pct: 5,  winner: false },
        { label: "« бог»",    pct: 3,  winner: false }
      ]
    },
    {
      spawnTokenIndex: 1,
      candidates: [
        { label: "«ник»",  pct: 95, winner: true },
        { label: "«ница»", pct: 4,  winner: false }
      ]
    },
    {
      spawnTokenIndex: 2,
      candidates: [
        { label: "«.»", pct: 46, winner: true },
        { label: "«»",  pct: 21, winner: false },
        { label: "«!»", pct: 9,  winner: false },
        { label: "«,»", pct: 7,  winner: false }
      ]
    },
    {
      spawnTokenIndex: 3,
      candidates: [
        { label: "EOS (конец)",       pct: 82, winner: true },
        { label: "⏎ перенос строки", pct: 9,  winner: false },
        { label: "« П»",              pct: 4,  winner: false }
      ]
    }
  ];

  // Round 1 is slow & detailed (~9.8s); Rounds 2, 3, 4 progressively speed up
  const ROUND_TIMINGS = [
    { roundIndex: 0, inCount: 14, tStart: 11.2, tEnterEnd: 14.0, tBarsEnd: 18.2, tExitEnd: 21.0 },
    { roundIndex: 1, inCount: 15, tStart: 21.0, tEnterEnd: 22.8, tBarsEnd: 24.4, tExitEnd: 25.8 },
    { roundIndex: 2, inCount: 16, tStart: 25.8, tEnterEnd: 27.1, tBarsEnd: 28.1, tExitEnd: 29.1 },
    { roundIndex: 3, inCount: 17, tStart: 29.1, tEnterEnd: 30.1, tBarsEnd: 31.1, tExitEnd: 32.0 }
  ];

  // ============================================================================
  // 4. MATH & DRAWING UTILITIES
  // ============================================================================
  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function norm(v, a, b) {
    if (b === a) return 0;
    return clamp((v - a) / (b - a), 0, 1);
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function hexToRgba(hex, alpha) {
    const clean = hex.replace('#', '');
    const num = parseInt(clean, 16);
    const r = (num >> 16) & 255;
    const g = (num >> 8) & 255;
    const b = num & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function drawRoundedRect(context, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    context.beginPath();
    context.moveTo(x + radius, y);
    context.arcTo(x + w, y, x + w, y + h, radius);
    context.arcTo(x + w, y + h, x, y + h, radius);
    context.arcTo(x, y + h, x, y, radius);
    context.arcTo(x, y, x + w, y, radius);
    context.closePath();
  }

  // ============================================================================
  // 5. GEOMETRY & TRACK CALCULATIONS
  // ============================================================================
  const LOOP_TRACK = {
    leftX: 145,
    rightX: 1135,
    topY: 340,
    bottomY: 540,
    radius: 100,
    straightLen: 1135 - 145,
    arcLen: Math.PI * 100,
    get totalLen() {
      return 2 * this.straightLen + 2 * this.arcLen;
    },
    getPointAtS(s) {
      const L = this.totalLen;
      let d = ((s % L) + L) % L;
      if (d <= this.straightLen) {
        return { x: this.leftX + d, y: this.topY };
      }
      d -= this.straightLen;
      if (d <= this.arcLen) {
        const angle = -Math.PI / 2 + (d / this.arcLen) * Math.PI;
        return {
          x: this.rightX + Math.cos(angle) * this.radius,
          y: (this.topY + this.radius) + Math.sin(angle) * this.radius
        };
      }
      d -= this.arcLen;
      if (d <= this.straightLen) {
        return { x: this.rightX - d, y: this.bottomY };
      }
      d -= this.straightLen;
      const angle = Math.PI / 2 + (d / this.arcLen) * Math.PI;
      return {
        x: this.leftX + Math.cos(angle) * this.radius,
        y: (this.topY + this.radius) + Math.sin(angle) * this.radius
      };
    }
  };

  const MBOX = {
    x: 205,
    y: 242,
    w: 265,
    h: 196,
    sCenter: (205 - LOOP_TRACK.leftX) + 265 / 2
  };

  const layouts = {
    splitCenter: [],
    beadLine: [],
    finalUnfold: []
  };

  function computeStaticLayouts() {
    // 1. Split tokens layout in center (Step 2 & 3)
    ctx.font = '600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    const gap = 8;
    const chipWidths = BASE_TOKENS.map(tok => Math.ceil(ctx.measureText(tok.text).width) + 20);
    const totalW = chipWidths.reduce((a, b) => a + b, 0) + gap * (BASE_TOKENS.length - 1);
    let curX = (STAGE_W - totalW) / 2;

    layouts.splitCenter = BASE_TOKENS.map((tok, i) => {
      const w = chipWidths[i];
      const item = { x: curX + w / 2, y: 310, w, h: 42 };
      curX += w + gap;
      return item;
    });

    // 2. Initial 14-bead chain layout before entering Model
    const beadPitch = 46;
    const totalBeadW = (BASE_TOKENS.length - 1) * beadPitch;
    const startBeadX = (STAGE_W - totalBeadW) / 2;
    layouts.beadLine = BASE_TOKENS.map((_, i) => ({
      x: startBeadX + i * beadPitch,
      y: 340,
      w: 46,
      h: 32
    }));

    // 3. Final unfolded 18 tokens (14 user + 3 model + EOS)
    ctx.font = '600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    const finalGap = 6;
    const finalWidths = ALL_TOKENS.map(tok => {
      if (tok.isEOS) return 46;
      return Math.ceil(ctx.measureText(tok.text).width) + 16;
    });
    const totalFinalW = finalWidths.reduce((a, b) => a + b, 0) + finalGap * (ALL_TOKENS.length - 1);
    let fX = (STAGE_W - totalFinalW) / 2;

    layouts.finalUnfold = ALL_TOKENS.map((tok, i) => {
      const w = finalWidths[i];
      const item = { x: fX + w / 2, y: 325, w, h: tok.isEOS ? 36 : 40 };
      fX += w + finalGap;
      return item;
    });
  }

  computeStaticLayouts();

  // ============================================================================
  // 6. PLAYBACK STATE & CONTROLS (SPACE, R, H, CLICK)
  // ============================================================================
  let animTime = 0;
  let isPlaying = false;
  let hasStarted = false;
  let lastFrameTimestamp = null;

  const btnRestart = document.getElementById('btn-restart');
  const hudRestoreBtn = document.getElementById('hud-restore-btn');

  function ensureKeyboardFocus() {
    try {
      window.focus();
      if (document.body) {
        document.body.focus({ preventScroll: true });
      }
    } catch (_) {}
  }

  function flashButton(btn) {
    if (!btn) return;
    btn.classList.add('flash-active');
    setTimeout(() => {
      btn.classList.remove('flash-active');
    }, 180);
  }

  function updateUIState() {
    if (hasStarted) {
      startPrompt.classList.add('hidden');
    } else {
      startPrompt.classList.remove('hidden');
    }

    if (isPlaying) {
      playIndicator.classList.remove('paused');
    } else {
      playIndicator.classList.add('paused');
    }
  }

  function togglePlay(btnEl) {
    if (btnEl && typeof btnEl.blur === 'function') btnEl.blur();
    if (!hasStarted) {
      hasStarted = true;
      isPlaying = true;
    } else if (animTime >= TIMELINE_END) {
      animTime = 0;
      isPlaying = true;
    } else {
      isPlaying = !isPlaying;
    }
    lastFrameTimestamp = performance.now();
    updateUIState();
    renderScene(animTime);
    ensureKeyboardFocus();
  }

  function restartAnimation(btnEl) {
    if (btnEl && typeof btnEl.blur === 'function') btnEl.blur();
    animTime = 0;
    hasStarted = true;
    isPlaying = true;
    lastFrameTimestamp = performance.now();
    flashButton(btnRestart);
    updateUIState();
    renderScene(0);
    ensureKeyboardFocus();
  }

  function toggleHud(btnEl) {
    if (btnEl && typeof btnEl.blur === 'function') btnEl.blur();
    const isNowHidden = controlsBar.classList.toggle('hud-hidden');
    if (isNowHidden) {
      hudRestoreBtn.classList.add('visible');
    } else {
      hudRestoreBtn.classList.remove('visible');
    }
    ensureKeyboardFocus();
  }

  // Expose global handlers for inline onclick attributes
  window.appTogglePlay = togglePlay;
  window.appRestart = restartAnimation;
  window.appToggleHud = toggleHud;

  // Keep keyboard focus inside the iframe on load and on any pointer interaction
  window.addEventListener('load', ensureKeyboardFocus);
  document.addEventListener('pointerdown', () => {
    ensureKeyboardFocus();
  }, { passive: true });

  // Deduplicate keydown in case both window and document fire in capture phase
  let lastHandledKeyEvent = null;

  function handleKeyDown(e) {
    if (e === lastHandledKeyEvent) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const code = e.code || '';
    const key = e.key || '';
    const keyCode = e.keyCode || e.which || 0;

    const isSpace = (code === 'Space' || key === ' ' || keyCode === 32);
    const isR = (code === 'KeyR' || key === 'r' || key === 'R' || key === 'к' || key === 'К' || keyCode === 82);
    const isH = (code === 'KeyH' || key === 'h' || key === 'H' || key === 'р' || key === 'Р' || keyCode === 72);

    if (isSpace) {
      lastHandledKeyEvent = e;
      e.preventDefault();
      e.stopPropagation();
      togglePlay();
    } else if (isR) {
      lastHandledKeyEvent = e;
      e.preventDefault();
      e.stopPropagation();
      restartAnimation();
    } else if (isH) {
      lastHandledKeyEvent = e;
      e.preventDefault();
      e.stopPropagation();
      toggleHud();
    }
  }

  window.addEventListener('keydown', handleKeyDown, { capture: true });
  document.addEventListener('keydown', handleKeyDown, { capture: true });

  // Clicking on the stage background/canvas toggles play/pause (ignoring clicks on HUD buttons)
  stageWrapper.addEventListener('click', (e) => {
    if (e.target.closest('#controls-bar') || e.target.closest('#hud-restore-btn')) {
      return;
    }
    togglePlay();
  });

  // ============================================================================
  // 7. CAPTION HELPER
  // ============================================================================
  const CAPTIONS = [
    { start: 3.6,  end: 6.1,  text: "Текст режется на токены" },
    { start: 6.2,  end: 11.1, text: "Модель видит только номера" },
    { start: 11.2, end: 14.1, text: "Весь текст целиком заходит в модель" },
    { start: 14.2, end: 17.2, text: "Модель считает вероятности следующего токена" },
    { start: 17.3, end: 21.1, text: "Сэмплер выбирает один токен, он дописывается в конец" },
    { start: 21.2, end: 31.9, text: "И так по кругу, пока не выпадет токен конца" }
  ];

  function drawBottomCaption(t) {
    for (const cap of CAPTIONS) {
      if (t >= cap.start && t <= cap.end) {
        const fadeIn = norm(t, cap.start, cap.start + 0.35);
        const fadeOut = 1 - norm(t, cap.end - 0.35, cap.end);
        const alpha = Math.min(fadeIn, fadeOut);

        ctx.save();
        ctx.globalAlpha = alpha;

        ctx.font = '600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        const textW = ctx.measureText(cap.text).width;
        const boxW = textW + 44;
        const boxH = 48;
        const boxX = (STAGE_W - boxW) / 2;
        const boxY = 638;

        // Pill backdrop
        drawRoundedRect(ctx, boxX, boxY, boxW, boxH, 24);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
        ctx.stroke();

        // Text
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(cap.text, STAGE_W / 2, boxY + boxH / 2 + 1);
        ctx.restore();
        break;
      }
    }
  }

  // ============================================================================
  // 8. COMPONENT RENDERERS
  // ============================================================================

  // Step 1: Chat Input Bar at the bottom
  function drawChatInputStep(t) {
    if (t > 4.6) return;

    const fadeOut = 1 - easeInOutCubic(norm(t, 3.6, 4.4));
    if (fadeOut <= 0) return;

    ctx.save();
    ctx.globalAlpha = fadeOut;

    const boxW = 940;
    const boxH = 68;
    const boxX = (STAGE_W - boxW) / 2;
    const boxY = 545;

    // Input bar background
    drawRoundedRect(ctx, boxX, boxY, boxW, boxH, 16);
    ctx.fillStyle = '#111827';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
    ctx.stroke();

    // Prompt icon on left
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(boxX + 32, boxY + boxH / 2, 7, 0, Math.PI * 2);
    ctx.fill();

    // Typed characters (0.2s to 3.2s)
    const typeProgress = norm(t, 0.2, 3.15);
    const charCount = Math.floor(typeProgress * FULL_USER_TEXT.length);
    const visibleText = FULL_USER_TEXT.slice(0, charCount);

    // If text rises at t > 3.5, hide text inside input box
    if (t < 3.5) {
      ctx.font = '500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#f8fafc';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const textX = boxX + 56;
      const textY = boxY + boxH / 2 + 1;
      ctx.fillText(visibleText, textX, textY);

      // Blinking cursor
      const cursorX = textX + ctx.measureText(visibleText).width + 3;
      if (Math.sin(t * 10) > -0.2 || typeProgress < 1) {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(cursorX, boxY + 19, 2.5, 30);
      }
    }

    // Subtle label above input
    ctx.font = '500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.textAlign = 'left';
    ctx.fillText('Запрос пользователя (промпт)', boxX + 8, boxY - 12);

    ctx.restore();
  }

  // Draw a single token/bead morphing smoothly between Text Chip mode and Bead mode
  // beadMorph: 0 = Text Chip (with text inside & optional ID underneath), 1 = Compact Bead (with ID inside)
  function drawTokenElement(tok, state) {
    const {
      x, y, w, h,
      chipColorAlpha = 0.25,
      idBelowAlpha = 0,
      beadMorph = 0,
      highlightGlow = 0,
      scale = 1,
      alpha = 1,
      showModelOutline = false
    } = state;

    if (alpha <= 0.001) return;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    if (scale !== 1) ctx.scale(scale, scale);

    const isEOS = Boolean(tok.isEOS);
    const radius = isEOS ? 6 : lerp(10, 17, beadMorph);

    // Highlight glow (for the two " как" tokens or model tokens)
    if (highlightGlow > 0) {
      ctx.save();
      ctx.shadowColor = tok.color;
      ctx.shadowBlur = 22 * highlightGlow;
      drawRoundedRect(ctx, -w / 2 - 2, -h / 2 - 2, w + 4, h + 4, radius + 2);
      ctx.strokeStyle = hexToRgba(tok.color, 0.9 * highlightGlow);
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }

    // Background fill
    const fillAlpha = lerp(chipColorAlpha, 0.88, beadMorph);
    drawRoundedRect(ctx, -w / 2, -h / 2, w, h, radius);
    ctx.fillStyle = chipColorAlpha <= 0.01 && beadMorph === 0
      ? 'rgba(255,255,255,0)'
      : hexToRgba(tok.color, fillAlpha);
    ctx.fill();

    // Border
    const borderAlpha = lerp(chipColorAlpha * 2.5, 1, beadMorph);
    if (borderAlpha > 0.02) {
      ctx.lineWidth = showModelOutline ? 2.5 : (beadMorph > 0.5 ? 1.8 : 1.5);
      ctx.strokeStyle = showModelOutline
        ? '#ffffff'
        : hexToRgba(tok.color, clamp(borderAlpha, 0, 1));
      ctx.stroke();

      if (showModelOutline) {
        drawRoundedRect(ctx, -w / 2 - 3, -h / 2 - 3, w + 6, h + 6, radius + 3);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = hexToRgba(tok.color, 0.85);
        ctx.stroke();
      }
    }

    // 1. Token Letters (fade out as beadMorph -> 1)
    const textAlpha = 1 - norm(beadMorph, 0, 0.55);
    if (textAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = alpha * textAlpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (isEOS) {
        ctx.font = '700 15px "JetBrains Mono", Consolas, monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('EOS', 0, 1);
      } else {
        // Render leading space with a subtle visible dot when chip is colored
        const hasLeadingSpace = tok.text.startsWith(' ');
        ctx.font = state.finalMode
          ? '600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
          : '600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

        ctx.fillStyle = '#f8fafc';
        ctx.fillText(tok.text, 0, 1);

        // Subtle space indicator dot on the leading space so tokenization rule is crystal clear
        if (hasLeadingSpace && chipColorAlpha > 0.1) {
          const fullW = ctx.measureText(tok.text).width;
          const spaceW = ctx.measureText(' ').width;
          const dotX = -fullW / 2 + spaceW / 2;
          ctx.fillStyle = hexToRgba('#ffffff', 0.42 * (chipColorAlpha / 0.28));
          ctx.beginPath();
          ctx.arc(dotX, 1, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // 2. Token ID Below the Chip (during Step 3 and Finale Step 8)
    if (idBelowAlpha > 0.01 && !isEOS) {
      ctx.save();
      ctx.globalAlpha = alpha * idBelowAlpha * (1 - beadMorph);
      ctx.font = '600 13px "JetBrains Mono", Consolas, monospace';
      ctx.fillStyle = highlightGlow > 0.2 ? '#fbbf24' : '#94a3b8';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(tok.id, 0, h / 2 + 8);
      ctx.restore();
    }

    // 3. Bead ID Inside the Bead (when beadMorph -> 1)
    const beadTextAlpha = norm(beadMorph, 0.35, 0.9);
    if (beadTextAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = alpha * beadTextAlpha;
      ctx.font = isEOS
        ? '700 13px "JetBrains Mono", Consolas, monospace'
        : '700 12px "JetBrains Mono", Consolas, monospace';
      ctx.fillStyle = '#090d16';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const label = isEOS ? 'EOS' : tok.id;
      ctx.fillText(label, 0, 1);
      ctx.restore();
    }

    ctx.restore();
  }

  // Draw Connecting Arc between the two " как" tokens (#4 and #13, 0-indexed)
  function drawSameTokenHighlight(t) {
    if (t < 7.3 || t > 9.7) return;
    const pIn = easeOutCubic(norm(t, 7.3, 7.8));
    const pOut = 1 - easeInOutCubic(norm(t, 9.2, 9.7));
    const alpha = Math.min(pIn, pOut);
    if (alpha <= 0.01) return;

    const posA = layouts.splitCenter[4];
    const posB = layouts.splitCenter[13];

    ctx.save();
    ctx.globalAlpha = alpha;

    // Upper connecting arch
    const startX = posA.x;
    const endX = posB.x;
    const midX = (startX + endX) / 2;
    const startY = posA.y - posA.h / 2 - 6;
    const peakY = startY - 68;

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(midX, peakY, endX, startY);
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2.2;
    ctx.setLineDash([6, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Endpoint dots
    [startX, endX].forEach(px => {
      ctx.beginPath();
      ctx.arc(px, startY, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#fbbf24';
      ctx.fill();
    });

    // Label pill at peak of arch
    const label = "одинаковый токен « как» → один и тот же номер 6220";
    ctx.font = '600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    const lw = ctx.measureText(label).width + 26;
    const lh = 30;
    const ly = (startY + peakY) / 2 - 4;

    drawRoundedRect(ctx, midX - lw / 2, ly - lh / 2, lw, lh, 15);
    ctx.fillStyle = 'rgba(245, 158, 11, 0.18)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.65)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = '#fde68a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, midX, ly + 1);

    ctx.restore();
  }

  // Draw the Track & Model Box during Steps 4–7
  function drawModelAndTrack(t, layerActivity) {
    if (t < 10.8 || t > 33.4) return;
    const enterAlpha = easeInOutCubic(norm(t, 10.8, 11.6));
    const exitAlpha = 1 - easeInOutCubic(norm(t, 32.1, 33.1));
    const alpha = Math.min(enterAlpha, exitAlpha);
    if (alpha <= 0.01) return;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 1. Subtle Loop Track Guide Line
    const trackW = LOOP_TRACK.straightLen + LOOP_TRACK.radius * 2;
    const trackH = LOOP_TRACK.radius * 2;
    const trackX = LOOP_TRACK.leftX - LOOP_TRACK.radius;
    const trackY = LOOP_TRACK.topY;

    drawRoundedRect(ctx, trackX, trackY, trackW, trackH, LOOP_TRACK.radius);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 8]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Direction arrows on bottom track (pointing right-to-left)
    const arrowPositions = [420, 680, 940];
    ctx.fillStyle = 'rgba(148, 163, 184, 0.28)';
    arrowPositions.forEach(ax => {
      const ay = LOOP_TRACK.bottomY;
      ctx.beginPath();
      ctx.moveTo(ax - 7, ay);
      ctx.lineTo(ax + 5, ay - 5);
      ctx.lineTo(ax + 5, ay + 5);
      ctx.closePath();
      ctx.fill();
    });

    // 2. Model Box Container
    const { x, y, w, h } = MBOX;

    // Outer ambient glow when processing
    if (layerActivity > 0.01) {
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 28 * layerActivity;
      drawRoundedRect(ctx, x, y, w, h, 18);
      ctx.strokeStyle = `rgba(56, 189, 248, ${0.45 * layerActivity})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    // Box Backdrop
    drawRoundedRect(ctx, x, y, w, h, 18);
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, 'rgba(15, 23, 42, 0.95)');
    grad.addColorStop(1, 'rgba(10, 15, 29, 0.95)');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
    ctx.stroke();

    // Left Entry & Right Exit Port Notches
    const portH = 44;
    const portY = LOOP_TRACK.topY - portH / 2;
    ctx.fillStyle = '#090d16';
    ctx.fillRect(x - 3, portY, 6, portH);
    ctx.fillRect(x + w - 3, portY, 6, portH);

    // 5 Horizontal Neural Layers inside the Model Box
    const numLayers = 5;
    const layerPadX = 24;
    const layerStartY = y + 54;
    const layerGap = 25;

    for (let i = 0; i < numLayers; i++) {
      const ly = layerStartY + i * layerGap;
      const wave = layerActivity > 0
        ? 0.5 + 0.5 * Math.sin(t * 9 - i * 0.9)
        : 0;
      const activeIntensity = layerActivity * wave;

      drawRoundedRect(ctx, x + layerPadX, ly - 5, w - layerPadX * 2, 10, 5);
      ctx.fillStyle = activeIntensity > 0.05
        ? `rgba(56, 189, 248, ${0.18 + 0.55 * activeIntensity})`
        : 'rgba(148, 163, 184, 0.13)';
      ctx.fill();

      ctx.lineWidth = 1;
      ctx.strokeStyle = activeIntensity > 0.05
        ? `rgba(125, 211, 252, ${0.4 + 0.5 * activeIntensity})`
        : 'rgba(148, 163, 184, 0.2)';
      ctx.stroke();
    }

    // Header Label "Модель"
    ctx.font = '700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('Модель', x + w / 2, y + 16);

    ctx.restore();
  }

  // Draw Probability Bars Chart above the right side of the Model Box
  function drawProbabilityChart(roundIdx, growProgress, highlightProgress, fadeOutProgress) {
    const alpha = clamp(growProgress * 3, 0, 1) * (1 - fadeOutProgress);
    if (alpha <= 0.01) return;

    const roundInfo = ROUNDS_DATA[roundIdx];
    const candidates = roundInfo.candidates;
    const winToken = MODEL_TOKENS[roundInfo.spawnTokenIndex];

    // Panel positioned above the right side of the Model box
    const panelX = 365;
    const panelY = 42;
    const panelW = 520;
    const panelH = 186;

    ctx.save();
    ctx.globalAlpha = alpha;

    // Panel container
    drawRoundedRect(ctx, panelX, panelY, panelW, panelH, 14);
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.22)';
    ctx.stroke();

    // Small corner note: "вероятности для примера"
    ctx.font = '500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('вероятности для примера', panelX + panelW - 14, panelY + panelH - 10);

    // Vertical column bars growing upwards
    const numBars = candidates.length;
    const chartLeft = panelX + 28;
    const chartRight = panelX + panelW - 28;
    const chartBottom = panelY + 132;
    const maxBarH = 74;
    const slotW = (chartRight - chartLeft) / numBars;
    const barW = Math.min(64, slotW * 0.56);

    let winnerCenter = { x: panelX + panelW / 2, y: chartBottom - 40 };

    candidates.forEach((cand, idx) => {
      const cx = chartLeft + slotW * (idx + 0.5);
      const easeGrow = easeOutCubic(growProgress);
      const targetH = Math.max(8, (cand.pct / 100) * maxBarH);
      const curH = targetH * easeGrow;
      const bx = cx - barW / 2;
      const by = chartBottom - curH;

      const isWin = cand.winner && highlightProgress > 0;

      if (cand.winner) {
        winnerCenter = { x: cx, y: by - 14 };
      }

      // Bar glow if selected
      if (isWin) {
        ctx.save();
        ctx.shadowColor = winToken.color;
        ctx.shadowBlur = 18 * highlightProgress;
        drawRoundedRect(ctx, bx - 2, by - 2, barW + 4, curH + 4, 7);
        ctx.strokeStyle = winToken.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      // Bar fill
      drawRoundedRect(ctx, bx, by, barW, curH, 6);
      ctx.fillStyle = isWin
        ? winToken.color
        : (cand.winner ? hexToRgba(winToken.color, 0.65) : 'rgba(100, 116, 139, 0.45)');
      ctx.fill();

      // Percentage above bar
      ctx.font = '700 14px "JetBrains Mono", Consolas, monospace';
      ctx.fillStyle = isWin ? '#ffffff' : '#cbd5e1';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      const shownPct = Math.round(cand.pct * easeGrow);
      ctx.fillText(`${shownPct}%`, cx, by - 5);

      // Token label below baseline
      ctx.font = '600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = isWin ? winToken.color : '#e2e8f0';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(cand.label, cx, chartBottom + 8);
    });

    // Baseline
    ctx.beginPath();
    ctx.moveTo(chartLeft, chartBottom);
    ctx.lineTo(chartRight, chartBottom);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
    return winnerCenter;
  }

  // ============================================================================
  // 9. MASTER SCENE RENDERER AT TIME `t`
  // ============================================================================
  function renderScene(t) {
    ctx.clearRect(0, 0, STAGE_W, STAGE_H);

    // ------------------------------------------------------------------------
    // PHASE A: Step 1 (Typing) & Step 2 (Split into Tokens) & Step 3 (Beads)
    // ------------------------------------------------------------------------
    drawChatInputStep(t);

    if (t >= 3.5 && t < 11.2) {
      // Transition from bottom input box (3.5s) to center split tokens (4.5s)
      const riseP = easeInOutCubic(norm(t, 3.5, 4.45));
      const splitP = easeInOutCubic(norm(t, 4.2, 5.2));
      const idAppearP = easeOutCubic(norm(t, 6.2, 7.2));
      const sameGlowP = (t >= 7.3 && t <= 9.6)
        ? Math.min(norm(t, 7.3, 7.8), 1 - norm(t, 9.1, 9.6))
        : 0;
      const beadMorphP = easeInOutCubic(norm(t, 9.6, 11.0));

      // Compute starting unsplit positions (as a single continuous line of text)
      ctx.font = '600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      const fullLineW = ctx.measureText(FULL_USER_TEXT).width;
      const unsplitStartX = (STAGE_W - fullLineW) / 2;
      let runningTextW = 0;

      // Draw connecting lines between beads as they morph into a chain (t > 9.8)
      if (beadMorphP > 0.2) {
        ctx.save();
        ctx.globalAlpha = (beadMorphP - 0.2) / 0.8;
        ctx.beginPath();
        for (let i = 0; i < BASE_TOKENS.length; i++) {
          const splitPos = layouts.splitCenter[i];
          const beadPos = layouts.beadLine[i];
          const bx = lerp(splitPos.x, beadPos.x, beadMorphP);
          const by = lerp(splitPos.y, beadPos.y, beadMorphP);
          if (i === 0) ctx.moveTo(bx, by);
          else ctx.lineTo(bx, by);
        }
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      }

      BASE_TOKENS.forEach((tok, i) => {
        ctx.font = '600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        const rawW = ctx.measureText(tok.text).width;
        const unsplitX = unsplitStartX + runningTextW + rawW / 2;
        runningTextW += rawW;

        const unsplitY = lerp(579, 300, riseP);
        const splitPos = layouts.splitCenter[i];
        const beadPos = layouts.beadLine[i];

        const midX = lerp(unsplitX, splitPos.x, splitP);
        const midY = lerp(unsplitY, splitPos.y, splitP);

        const curX = lerp(midX, beadPos.x, beadMorphP);
        const curY = lerp(midY, beadPos.y, beadMorphP);
        const curW = lerp(splitPos.w, beadPos.w, beadMorphP);
        const curH = lerp(splitPos.h, beadPos.h, beadMorphP);

        const isSame = Boolean(tok.isSamePair);
        const pulse = isSame ? sameGlowP * (0.75 + 0.25 * Math.sin(t * 8)) : 0;

        drawTokenElement(tok, {
          x: curX,
          y: curY,
          w: curW,
          h: curH,
          chipColorAlpha: splitP * 0.28,
          idBelowAlpha: idAppearP,
          beadMorph: beadMorphP,
          highlightGlow: pulse
        });
      });

      drawSameTokenHighlight(t);
    }

    // ------------------------------------------------------------------------
    // PHASE B: Steps 4–7 (The 4 Autoregressive Loop Rounds, 11.2s – 32.0s)
    // ------------------------------------------------------------------------
    if (t >= 11.2 && t < 32.0) {
      // Find active round
      let activeRound = ROUND_TIMINGS[0];
      for (const r of ROUND_TIMINGS) {
        if (t >= r.tStart && t <= r.tExitEnd) {
          activeRound = r;
          break;
        }
      }

      const { roundIndex, inCount, tStart, tEnterEnd, tBarsEnd, tExitEnd } = activeRound;
      const pEnter = easeInOutCubic(norm(t, tStart, tEnterEnd));
      const pBars  = norm(t, tEnterEnd, tBarsEnd);
      const pExit  = norm(t, tBarsEnd, tExitEnd);

      // Compute neural layer activity inside the Model box
      let layerActivity = 0;
      if (t >= tStart && t <= tExitEnd) {
        const enterRamp = norm(t, tStart + 0.3 * (tEnterEnd - tStart), tEnterEnd);
        const exitRamp = 1 - norm(t, tBarsEnd, tBarsEnd + 0.65 * (tExitEnd - tBarsEnd));
        layerActivity = Math.min(enterRamp, exitRamp);
      }

      drawModelAndTrack(t, layerActivity);

      // Determine probability chart growth, highlight, and fade
      const barGrowP = easeOutCubic(norm(pBars, 0.0, 0.62));
      const barHighP = easeOutCubic(norm(pBars, 0.58, 0.95));
      const barFadeP = easeInOutCubic(norm(pExit, 0.55, 0.95));
      const winnerOrigin = drawProbabilityChart(roundIndex, barGrowP, barHighP, barFadeP) || { x: 460, y: 120 };

      // Calculate Track Positions for the `inCount` existing beads
      // Outside pitch is 41px; inside the Model box, pitch compresses to 14.5px so the ENTIRE chain fits inside MBOX!
      const OUTSIDE_PITCH = 41;
      const INSIDE_PITCH = 14.5;

      // Center of the chain inside the Model box is at `s = MBOX.sCenter` (192.5)
      // When the chain has exited to the right of the Model box, its first bead (index 0) is at `s = 360` (`x = 505`),
      // and its last bead (index `inCount - 1`) is at `s = 360 + (inCount - 1) * 41`!
      const exitedFirstS = 360;
      const exitedCenterS = exitedFirstS + ((inCount - 1) * OUTSIDE_PITCH) / 2;

      // In Round 0, at t = 11.2, the chain starts from `layouts.beadLine` and enters the Model box from the left.
      // In Rounds 1..3, at `tStart`, the chain starts from the previous round's exited position on the right of the Model box,
      // travels forward around the loop track (`s` increases by `LOOP_TRACK.totalLen`), and enters the Model box from the left (`MBOX.sCenter + LOOP_TRACK.totalLen`)!

      let curCenterS = MBOX.sCenter;
      let curPitch = INSIDE_PITCH;

      if (t <= tEnterEnd) {
        if (roundIndex === 0) {
          // Round 0: Smoothly move from initial beadLine into the left side of the Model box
          // Start center is on the left (`s = -160`, approaching left entrance `s = 60`), ending at `MBOX.sCenter` (`192.5`)
          curCenterS = lerp(-120, MBOX.sCenter, pEnter);
          curPitch = lerp(OUTSIDE_PITCH, INSIDE_PITCH, easeInOutCubic(norm(pEnter, 0.35, 1.0)));
        } else {
          // Rounds 1..3: Previous round ended with `inCount` beads (0 .. inCount-1) at `exitedFirstS`
          const prevExitedCenterS = exitedFirstS + ((inCount - 1) * OUTSIDE_PITCH) / 2;
          const targetInsideCenterS = MBOX.sCenter + LOOP_TRACK.totalLen;
          curCenterS = lerp(prevExitedCenterS, targetInsideCenterS, pEnter);
          // Compress pitch as the chain enters the left side of the Model box (last 28% of loop travel)
          curPitch = lerp(OUTSIDE_PITCH, INSIDE_PITCH, easeInOutCubic(norm(pEnter, 0.72, 1.0)));
        }
      } else if (t <= tBarsEnd) {
        // Chain is completely inside the Model box while probabilities are computed
        curCenterS = MBOX.sCenter + lerp(0, 12, pBars);
        curPitch = INSIDE_PITCH;
      } else {
        // Chain exits the right side of the Model box intact (`s` goes from `MBOX.sCenter + 12` to `exitedCenterS`)
        const exitEase = easeInOutCubic(norm(pExit, 0.0, 0.78));
        curCenterS = lerp(MBOX.sCenter + 12, exitedCenterS, exitEase);
        curPitch = lerp(INSIDE_PITCH, OUTSIDE_PITCH, exitEase);
      }

      // Compute individual (x, y) for each of the `inCount` beads
      const beadPositions = [];
      for (let i = 0; i < inCount; i++) {
        const offsetFromCenter = (i - (inCount - 1) / 2) * curPitch;
        const s_i = curCenterS + offsetFromCenter;
        let pt = LOOP_TRACK.getPointAtS(s_i);

        // For Round 0 initial entry (t < 12.2), blend smoothly from `layouts.beadLine[i]`
        if (roundIndex === 0 && t < 12.4) {
          const blend = easeInOutCubic(norm(t, 11.2, 12.2));
          const startPt = layouts.beadLine[i];
          pt = {
            x: lerp(startPt.x, pt.x, blend),
            y: lerp(startPt.y, pt.y, blend)
          };
        }
        beadPositions.push(pt);
      }

      // Check if the newly sampled bead (index `inCount`) is spawning & attaching
      const newToken = MODEL_TOKENS[ROUNDS_DATA[roundIndex].spawnTokenIndex];
      const spawnAppearP = easeOutBack(norm(pBars, 0.72, 1.0));
      const attachMoveP = easeInOutCubic(norm(pExit, 0.15, 0.85));

      let newBeadPos = null;
      if (spawnAppearP > 0.01) {
        const targetEndS = exitedFirstS + inCount * OUTSIDE_PITCH;
        const targetEndPt = LOOP_TRACK.getPointAtS(targetEndS);
        newBeadPos = {
          x: lerp(winnerOrigin.x, targetEndPt.x, attachMoveP),
          y: lerp(winnerOrigin.y, targetEndPt.y, attachMoveP)
        };
      }

      // Draw connecting chain link line through all active beads
      ctx.save();
      ctx.beginPath();
      beadPositions.forEach((pt, i) => {
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      if (newBeadPos && attachMoveP > 0.6) {
        ctx.lineTo(newBeadPos.x, newBeadPos.y);
      }
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.42)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // Draw all `inCount` beads
      const compactRatio = norm(curPitch, OUTSIDE_PITCH, INSIDE_PITCH);
      const curBeadW = lerp(46, 36, compactRatio);
      const curBeadH = lerp(32, 26, compactRatio);

      for (let i = 0; i < inCount; i++) {
        const tok = ALL_TOKENS[i];
        const pt = beadPositions[i];
        drawTokenElement(tok, {
          x: pt.x,
          y: pt.y,
          w: curBeadW,
          h: curBeadH,
          beadMorph: 1,
          showModelOutline: tok.isModel
        });
      }

      // Draw newly spawned bead flying from winning probability bar to the tail end of the chain
      if (newBeadPos) {
        drawTokenElement(newToken, {
          x: newBeadPos.x,
          y: newBeadPos.y,
          w: 46,
          h: 32,
          beadMorph: 1,
          scale: clamp(spawnAppearP, 0, 1.15),
          highlightGlow: 1 - attachMoveP * 0.5,
          showModelOutline: true
        });
      }
    }

    // ------------------------------------------------------------------------
    // PHASE C: Step 8 — Finale: Unfolding Chain Back into Text (32.0s – 38.0s)
    // ------------------------------------------------------------------------
    if (t >= 32.0) {
      drawModelAndTrack(t, 0);

      // At t = 32.0, all 18 beads are at their Round 4 exited positions:
      // `s_i = 360 + i * 41` for `i = 0 .. 17`
      const unfoldMoveP = easeInOutCubic(norm(t, 32.2, 33.8));
      const unfoldMorphP = 1 - easeInOutCubic(norm(t, 33.2, 34.5)); // 1 -> 0 (Bead -> Text Chip)
      const idFadeInP = easeOutCubic(norm(t, 34.0, 34.9));
      const quoteNoteP = easeOutCubic(norm(t, 34.5, 35.5));

      const OUTSIDE_PITCH = 41;
      const exitedFirstS = 360;

      // Draw connecting chain line while still in bead state
      if (unfoldMorphP > 0.2) {
        ctx.save();
        ctx.globalAlpha = (unfoldMorphP - 0.2) / 0.8;
        ctx.beginPath();
        for (let i = 0; i < ALL_TOKENS.length; i++) {
          const startPt = LOOP_TRACK.getPointAtS(exitedFirstS + i * OUTSIDE_PITCH);
          const endPt = layouts.finalUnfold[i];
          const x = lerp(startPt.x, endPt.x, unfoldMoveP);
          const y = lerp(startPt.y, endPt.y, unfoldMoveP);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      }

      // Draw each of the 18 tokens (14 user + 3 model words + 1 EOS square badge)
      ALL_TOKENS.forEach((tok, i) => {
        const startPt = LOOP_TRACK.getPointAtS(exitedFirstS + i * OUTSIDE_PITCH);
        const endPt = layouts.finalUnfold[i];

        const curX = lerp(startPt.x, endPt.x, unfoldMoveP);
        const curY = lerp(startPt.y, endPt.y, unfoldMoveP);
        const curW = lerp(endPt.w, 46, unfoldMorphP);
        const curH = lerp(endPt.h, 32, unfoldMorphP);

        // User tokens get clean subtle background, Model tokens get bright glowing outline
        const isModelWord = tok.isModel && !tok.isEOS;

        drawTokenElement(tok, {
          x: curX,
          y: curY,
          w: curW,
          h: curH,
          chipColorAlpha: tok.isEOS ? 0.85 : (isModelWord ? 0.34 : 0.22),
          idBelowAlpha: idFadeInP,
          beadMorph: unfoldMorphP,
          highlightGlow: isModelWord ? (1 - unfoldMorphP) * 0.65 : 0,
          showModelOutline: tok.isModel,
          finalMode: true
        });
      });

      // Legend badges above User vs Model tokens + Picasso attribution below
      if (quoteNoteP > 0.01) {
        ctx.save();
        ctx.globalAlpha = quoteNoteP;

        // Bracket / label for User Prompt tokens (0..13)
        const uFirst = layouts.finalUnfold[0];
        const uLast = layouts.finalUnfold[13];
        const uMidX = (uFirst.x - uFirst.w / 2 + uLast.x + uLast.w / 2) / 2;

        // Bracket / label for Model Generated tokens (14..16)
        const mFirst = layouts.finalUnfold[14];
        const mLast = layouts.finalUnfold[16];
        const mMidX = (mFirst.x - mFirst.w / 2 + mLast.x + mLast.w / 2) / 2;

        const bracketY = 266;

        // User bracket line
        ctx.beginPath();
        ctx.moveTo(uFirst.x - uFirst.w / 2 + 4, bracketY + 8);
        ctx.lineTo(uFirst.x - uFirst.w / 2 + 4, bracketY);
        ctx.lineTo(uLast.x + uLast.w / 2 - 4, bracketY);
        ctx.lineTo(uLast.x + uLast.w / 2 - 4, bracketY + 8);
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = '500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('текст пользователя (14 токенов)', uMidX, bracketY - 6);

        // Model bracket line
        ctx.beginPath();
        ctx.moveTo(mFirst.x - mFirst.w / 2 + 2, bracketY + 8);
        ctx.lineTo(mFirst.x - mFirst.w / 2 + 2, bracketY);
        ctx.lineTo(mLast.x + mLast.w / 2 - 2, bracketY);
        ctx.lineTo(mLast.x + mLast.w / 2 - 2, bracketY + 8);
        ctx.strokeStyle = '#fb923c';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#fdba74';
        ctx.fillText('дописала модель', mMidX, bracketY - 6);

        // Attribution note below
        ctx.font = '400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Цитату приписывают Пабло Пикассо', STAGE_W / 2, 415);

        ctx.restore();
      }
    }

    // Draw step caption at bottom center
    drawBottomCaption(t);
  }

  // ============================================================================
  // 10. ANIMATION LOOP (PAUSABLE CLOCK)
  // ============================================================================
  function tick(timestamp) {
    if (lastFrameTimestamp === null) {
      lastFrameTimestamp = timestamp;
    }
    const dt = Math.min((timestamp - lastFrameTimestamp) / 1000, 0.1);
    lastFrameTimestamp = timestamp;

    if (isPlaying) {
      animTime += dt;
      if (animTime >= TIMELINE_END) {
        animTime = TIMELINE_END;
        isPlaying = false;
        updateUIState();
      }
    }

    renderScene(animTime);
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
